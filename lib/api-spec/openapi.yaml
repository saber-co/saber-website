openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: demoRequests
    description: Demo request operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /demo-requests:
    post:
      operationId: createDemoRequest
      tags: [demoRequests]
      summary: Create a demo request
      description: Submits a demo / implementation request from the landing page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDemoRequestResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateDemoRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        company:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        challenge:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - name
        - company
        - email
        - challenge
    CreateDemoRequestResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

